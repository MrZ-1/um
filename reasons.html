<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>10 Reasons ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
background:#FFF8F2;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;
}

h1{
margin-bottom:35px;
color:#444;
font-size:34px;
}

.card{

width:90%;
max-width:340px;

background:white;

padding:35px;

border-radius:25px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.08);

transition:.4s;

}

.number{

font-size:18px;

color:#ff5c8d;

margin-bottom:18px;

font-weight:bold;

}

.reason{

font-family:Caveat,cursive;

font-size:38px;

color:#555;

line-height:1.4;

min-height:120px;

display:flex;

justify-content:center;

align-items:center;

}

button{

margin-top:35px;

padding:14px 34px;

border:none;

border-radius:30px;

background:#ff5c8d;

color:white;

font-size:16px;

cursor:pointer;

box-shadow:0 10px 25px rgba(255,90,150,.25);

}

.fade{

animation:fade .35s;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>

<h1>10 Reasons ❤️</h1>

<div class="card fade">

<div class="number" id="num">

Reason #1

</div>

<div class="reason" id="reason">

Your beautiful smile 😊

</div>

</div>

<button onclick="nextReason()">

Next ❤️

</button>

<script>

const reasons=[

"Your beautiful smile 😊",

"The way you laugh ❤️",

"How kind you are 🌸",

"You always make my day better ✨",

"Your cute little habits 🧸",

"How comfortable I feel with you 🤍",

"The way you care 💕",

"You're my favorite notification 📱",

"You make ordinary days special 🌷",

"Simply because you're you ❤️"

];

let i=0;

function nextReason(){

i++;

if(i<reasons.length){

document.querySelector(".card").classList.remove("fade");

void document.querySelector(".card").offsetWidth;

document.querySelector(".card").classList.add("fade");

document.getElementById("num").innerHTML="Reason #"+(i+1);

document.getElementById("reason").innerHTML=reasons[i];

}

else{

window.location="gallery.html";

}

}

</script>

</body>
</html>
