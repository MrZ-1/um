<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend's Day ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

width:100%;
height:100vh;

overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(
180deg,
#FFFDFB 0%,
#FFF7F4 35%,
#FFF2EE 100%
);

font-family:'Poppins',sans-serif;

position:relative;

}

/* Background Glow */

body::before{

content:"";

position:absolute;

width:650px;
height:650px;

border-radius:50%;

background:

radial-gradient(
circle,
rgba(255,170,195,.28),
transparent 70%
);

top:-220px;
right:-220px;

filter:blur(20px);

}

/* Second Glow */

body::after{

content:"";

position:absolute;

width:520px;
height:520px;

border-radius:50%;

background:

radial-gradient(
circle,
rgba(255,236,199,.55),
transparent 72%
);

bottom:-220px;
left:-220px;

filter:blur(18px);

}

/* Floating Particles */

.particle{

position:absolute;

width:8px;
height:8px;

background:#FFD0DD;

border-radius:50%;

opacity:.45;

animation:floatUp linear infinite;

}

@keyframes floatUp{

0%{

transform:
translateY(120vh)
scale(.6);

opacity:0;

}

20%{

opacity:.5;

}

100%{

transform:
translateY(-20vh)
scale(1.2);

opacity:0;

}

}

/* Main Card */

.wrapper{

position:relative;

width:100%;
max-width:420px;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

z-index:10;

}

/* Heading */

.title{

font-size:44px;

font-weight:700;

color:#5A4A4A;

margin-top:35px;

}

.subtitle{

margin-top:12px;

font-size:17px;

color:#7D6E6E;

text-align:center;

line-height:1.8;

width:90%;

}

/* Letter */

.paper{

position:relative;

width:255px;
height:170px;

background:white;

border-radius:16px;

box-shadow:
0 12px 35px rgba(0,0,0,.08);

display:flex;
justify-content:center;
align-items:center;

flex-direction:column;

top:70px;

transition:1s cubic-bezier(.25,.8,.25,1);

z-index:1;

}

.paper h2{

font-family:'Caveat',cursive;

font-size:42px;

color:#444;

}

.paper p{

margin-top:8px;

font-size:15px;

color:#777;

text-align:center;

line-height:1.6;

}

/* ===========================
   PREMIUM ENVELOPE
=========================== */

.envelope{

position:relative;

width:290px;
height:200px;

margin-top:-10px;

cursor:pointer;

animation:float 4s ease-in-out infinite;

transition:.6s;

}

@keyframes float{

0%,100%{
transform:translateY(0px);
}

50%{
transform:translateY(-12px);
}

}

/* Envelope Body */

.env-body{

position:absolute;

bottom:0;

width:100%;
height:145px;

background:linear-gradient(
180deg,
#F7DEC8,
#EEC7A3
);

border-radius:0 0 18px 18px;

box-shadow:
0 18px 35px rgba(0,0,0,.12);

overflow:hidden;

z-index:3;

}

/* Left Fold */

.env-left{

position:absolute;

left:0;
bottom:0;

width:145px;
height:145px;

background:#E9BE97;

clip-path:polygon(
0 0,
100% 50%,
0 100%
);

z-index:4;

}

/* Right Fold */

.env-right{

position:absolute;

right:0;
bottom:0;

width:145px;
height:145px;

background:#E9BE97;

clip-path:polygon(
100% 0,
0 50%,
100% 100%
);

z-index:4;

}

/* Top Flap */

.env-flap{

position:absolute;

width:0;
height:0;

border-left:145px solid transparent;
border-right:145px solid transparent;
border-top:95px solid #F4CFAD;

transform-origin:top;

transition:1s;

z-index:6;

}

/* Wax Seal */

.seal{

position:absolute;

left:50%;
top:65px;

transform:translateX(-50%);

width:46px;
height:46px;

border-radius:50%;

background:linear-gradient(
180deg,
#FF6F97,
#E73F70
);

display:flex;
justify-content:center;
align-items:center;

color:white;

font-size:20px;

font-weight:bold;

box-shadow:
0 8px 18px rgba(255,80,120,.35);

z-index:8;

transition:.5s;

}

/* Shine */

.seal::before{

content:"";

position:absolute;

width:15px;
height:15px;

background:rgba(255,255,255,.45);

border-radius:50%;

top:8px;
left:10px;

}

/* Waiting Hint */

.tap{

margin-top:45px;

letter-spacing:4px;

font-size:12px;

color:#9E8D8D;

text-transform:uppercase;

animation:blink 2s infinite;

}

@keyframes blink{

50%{

opacity:.45;

}

}

/* Open Animation */

.open .paper{

transform:translateY(-95px);

}

.open .env-flap{

transform:rotateX(180deg);

}

.open .seal{

opacity:0;
transform:translateX(-50%) scale(.2);

}

/* Page Zoom */

.zoom{

animation:zoomOut .8s forwards;

}

@keyframes zoomOut{

to{

transform:scale(1.08);

opacity:0;

}

}

</style>

</head>

<body>

<script>

/* Floating Particles */

for(let i=0;i<35;i++){

let p=document.createElement("div");

p.className="particle";

let s=Math.random()*8+4;

p.style.width=s+"px";
p.style.height=s+"px";

p.style.left=Math.random()*100+"vw";

p.style.animationDuration=(8+Math.random()*6)+"s";

p.style.animationDelay=Math.random()*6+"s";

document.body.appendChild(p);

}

</script>

<div class="wrapper" id="page">

<!-- Letter -->

<div class="paper">

<h2>Hey, Love ❤️</h2>

<p>

I made something

special

just for you.

</p>

</div>

<!-- Envelope -->

<div class="envelope"

id="envelope"

onclick="openEnvelope()">

<div class="env-flap"></div>

<div class="env-left"></div>

<div class="env-right"></div>

<div class="env-body"></div>

<div class="seal">

❤

</div>

</div>

<div class="title">

Happy Girlfriend's Day

</div>

<div class="subtitle">

A tiny surprise,

made with lots of love.

</div>

<div class="tap">

Tap the envelope

</div>

</div>

<script>

function openEnvelope(){

const env=document.getElementById("envelope");
const page=document.getElementById("page");
const paper=document.querySelector(".paper");
const flap=document.querySelector(".env-flap");
const seal=document.querySelector(".seal");

env.style.pointerEvents="none";

/* Open the flap */

flap.style.transform="rotateX(180deg)";
seal.style.opacity="0";

/* Letter slides out */

setTimeout(()=>{

paper.style.transform="translateY(-120px) scale(1.02)";

},450);

/* Envelope drops slightly */

setTimeout(()=>{

env.style.transform="translateY(15px)";

},700);

/* Whole page gently zooms */

setTimeout(()=>{

page.classList.add("zoom");

},1600);

/* Go to next page */

setTimeout(()=>{

window.location.href="balloon.html";

},2400);

}

</script>

</body>
</html>
